function actHours(a){ return num(a.qtd) * (PER_WEEK[a.periodo]||0) * num(a.minutos) / 60; }
function allActs(s){ const out=[]; Object.entries(s.atividades||{}).forEach(([n,a])=>{ if(a&&a.on) out.push({...a,nome:n,sugerida:true}); }); (s.extras||[]).forEach(a=>{ if(a&&a.nome&&a.nome.trim()) out.push({...a,sugerida:false}); }); return out; }
function actMissing(a){ const m=[]; if(!num(a.qtd)) m.push("quantas vezes"); if(!a.periodo) m.push("período"); if(!num(a.minutos)) m.push("minutos"); if(!a.classe) m.push("classificação"); return m; }

/* ---------- persistência ---------- */
const LS = "rotina-capacity-operacional-v2";
function localSave(){ try{ localStorage.setItem(LS, JSON.stringify({S,step})); }catch(e){} }
function localLoad(){ try{ const r = JSON.parse(localStorage.getItem(LS)||"null"); return r; }catch(e){ return null; } }
const LS_ID = "rotina-capacity-operacional-id";
function getId(){
  let id = null;
  try{ id = localStorage.getItem(LS_ID); }catch(e){}
  if(!id){
    id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : "r-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,10);
    try{ localStorage.setItem(LS_ID, id); }catch(e){}
  }
  return id;
}
/* rascunho fica só no navegador; a planilha recebe as respostas quando a pessoa clica em Enviar */
function persist(status){
  if(status) S.status = status;
  localSave();
  if(status!=="enviado") return Promise.resolve(false);
  if(!SHEET_URL) return Promise.reject(new Error("sem-url"));
  const payload = buildPayload({...S, _id:myId, atualizadoEm:new Date().toISOString()});
  saving = saving.catch(()=>{}).then(() => fetch(SHEET_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)})).then(()=>true);
  return saving;
}

/* ---------- formulário ---------- */
function setVertical(){ document.body.dataset.v = S.vertical || ""; }
function progress(){ $("#progress").style.width = (view==="form" ? Math.round(step/(STEPS.length-1)*100) : 0) + "%"; $("#progressWrap").hidden = view!=="form"; }
function head(i){ return `<div class="stack" style="gap:6px"><span class="eyebrow">Etapa ${i} de ${STEPS.length-2} · ${STEPS[step].t}</span>`; }
function nav(nextLabel="Continuar", back=true){ return `<div class="btns">${back?`<button type="button" class="btn" data-go="-1">Voltar</button>`:"<span></span>"}<button type="button" class="btn primary" data-go="1">${nextLabel}</button></div>`; }

function actFields(a, key, idx){
  const pre = idx==null ? `data-a="${esc(key)}"` : `data-x="${idx}"`;
  const h = actHours(a);
  const ch = (f,val,cur,label) => `<button type="button" class="chip" ${pre} data-af="${f}" data-v="${esc(val)}" aria-pressed="${cur===val}">${esc(label||val)}</button>`;
  const mch = (f,val,arr) => `<button type="button" class="chip" ${pre} data-am="${f}" data-v="${esc(val)}" aria-pressed="${(arr||[]).includes(val)}">${esc(val)}</button>`;
  const iid = (idx==null?"a-"+[...key].reduce((s,c)=>(s*31+c.charCodeAt(0))|0,7):"x-"+idx);
  return `<div class="act-body">
    <div class="q"><span class="t">Quantas vezes você faz isso?</span><div class="row"><input type="number" min="0" step="1" inputmode="numeric" class="inline-num" id="${iid}-q" ${pre} data-ai="qtd" value="${esc(a.qtd||"")}" aria-label="Quantidade"><div class="chips">${PERIODS.map(([k,l])=>ch("periodo",k,a.periodo,l)).join("")}</div></div></div>
    <div class="q"><span class="t">Quanto tempo leva cada vez (minutos)?</span><div class="row"><div class="chips">${MINUTES.map(m=>ch("minutos",String(m),String(a.minutos||""),m<60?m+" min":(m%60?Math.floor(m/60)+"h"+(m%60):(m/60)+"h"))).join("")}</div><input type="number" min="0" step="1" inputmode="numeric" class="inline-num" id="${iid}-m" ${pre} data-ai="minutos" value="${MINUTES.includes(num(a.minutos))?"":esc(a.minutos||"")}" aria-label="Outro valor em minutos" placeholder="outro"></div></div>
    <div class="q"><span class="t">Ferramentas que usa</span><div class="chips">${TOOLS.map(t=>mch("ferramentas",t,a.ferramentas)).join("")}</div>${(a.ferramentas||[]).includes("Outra")?`<input type="text" id="${iid}-fo" ${pre} data-ai="ferramentasOutra" value="${esc(a.ferramentasOutra||"")}" placeholder="Qual outra ferramenta?">`:""}</div>
    <div class="q"><span class="t">Depende de outra pessoa ou área?</span><div class="row"><div class="chips">${ch("depende","Não",a.depende)}${ch("depende","Sim",a.depende)}</div>${a.depende==="Sim"?`<input type="text" id="${iid}-d" ${pre} data-ai="dependeDe" value="${esc(a.dependeDe||"")}" placeholder="De quem?" style="flex:1 1 200px">`:""}</div></div>
    <div class="q"><span class="t">Como você classifica esta atividade?</span><div class="chips">${CLASSES.map(c=>ch("classe",c,a.classe)).join("")}</div></div>
    <div class="q"><span class="t">Quem confere antes de seguir?</span><div class="chips">${["Ninguém","Meu gestor","Outra pessoa"].map(c=>ch("confere",c,a.confere)).join("")}</div>${a.confere==="Outra pessoa"?`<input type="text" id="${iid}-cq" ${pre} data-ai="confereQuem" value="${esc(a.confereQuem||"")}" placeholder="Quem confere?">`:""}</div>
    <div class="q"><span class="t">Poderia ser automática?</span><div class="chips">${["Sim","Não","Não sei"].map(c=>ch("auto",c,a.auto)).join("")}</div></div>
    <div class="calc" data-calc>${h?`≈ <b>${fmt(h)} h por semana</b>`:"Preencha quantidade, período e minutos para ver o tempo semanal."}</div>
  </div>`;
}
function renderAtiv(){
  const list = ACTIVITIES[S.cargo] || [];
  const acts = list.map(n => { const a = S.atividades[n]||{}; const miss = missing.has(n); return `<div class="act ${a.on?"on":""} ${miss?"miss":""}"><button type="button" class="act-head" data-toggle="${esc(n)}" aria-expanded="${!!a.on}"><span class="box"></span><span>${esc(n)}</span></button>${a.on?actFields(a,n,null):""}</div>`; }).join("");
  const extras = (S.extras||[]).map((a,i)=>{ const miss = missing.has("x"+i); return `<div class="act on ${miss?"miss":""}"><div class="act-head" style="cursor:default"><span class="box"></span><input type="text" class="custom-name" id="xn-${i}" data-x="${i}" data-ai="nome" value="${esc(a.nome||"")}" placeholder="Descreva a atividade"><button type="button" class="del" data-delx="${i}">Remover</button></div>${actFields(a,null,i)}</div>`; }).join("");
  const tot = allActs(S).reduce((s,a)=>s+actHours(a),0);
  return `<div class="stack">${head(3)}<h2>Suas atividades</h2>
    ${S.cargo==="outro"?`<div class="note">Como o seu cargo não está na lista, use <b>Adicionar outra atividade</b> para descrever cada atividade que você faz.</div>`:""}<p class="lead" style="margin:0">Marque as atividades que você faz e responda os campos de cada uma. Se fizer algo que não está na lista, use <b>Adicionar outra atividade</b> no final. Reuniões, WhatsApp e interrupções ficam para a próxima etapa.</p></div>
  <div class="legend"><div><b>Essencial do meu cargo</b>É para isso que fui contratado. Ex.: cotar com as seguradoras.</div><div><b>Apoio</b>Necessário, mas administrativo. Ex.: lançar no sistema.</div><div><b>Refazer ou corrigir</b>Algo que voltou ou veio incompleto. Ex.: pedir de novo um documento.</div></div>
  <div class="stack" style="gap:10px">${acts}${extras}
    ${(S.extras||[]).length<(S.cargo==="outro"?15:8)?`<button type="button" class="btn" data-addx style="align-self:flex-start">+ Adicionar outra atividade</button>`:""}
  </div>
  <div class="card summary"><div><span>Atividades marcadas</span><b>${allActs(S).length}</b></div><div><span>Tempo somado</span><b data-tot>${fmt(tot)} h/sem</b></div></div>
  ${missing.size?`<div class="note err">Algumas atividades marcadas estão sem quantidade, período, minutos ou classificação (destacadas em vermelho). Você pode completar agora ou continuar e ajustar depois.</div>`:""}
  ${nav()}`;
}

    <div class="q"><label class="t" for="deixaDeFazer"><span class="num">30</span>O que você deixa de fazer, ou faz com pressa, por falta de tempo?</label><textarea id="deixaDeFazer" data-in="deixaDeFazer">${esc(S.deixaDeFazer)}</textarea></div>
    <div class="q"><label class="t" for="menorValor"><span class="num">31</span>Qual atividade toma mais tempo e gera menos valor?</label><input type="text" id="menorValor" data-in="menorValor" value="${esc(S.menorValor)}"></div>
    <div class="q"><label class="t" for="automatizar"><span class="num">32</span>Se pudesse automatizar ou eliminar uma coisa da sua rotina, o que seria?</label><input type="text" id="automatizar" data-in="automatizar" value="${esc(S.automatizar)}"></div>
    <div class="q"><label class="t" for="oportunidades"><span class="num">33</span>Nos seus atendimentos, você percebe oportunidades de vender mais para o cliente (outro produto, mais vidas, outra cobertura)? O que faz com elas?</label><textarea id="oportunidades" data-in="oportunidades">${esc(S.oportunidades)}</textarea></div>
    <div class="q"><label class="t" for="comentario"><span class="num">34</span>Quer comentar mais alguma coisa? <span style="font-weight:400;color:var(--ink-3)">(opcional)</span></label><textarea id="comentario" data-in="comentario">${esc(S.comentario)}</textarea></div>
  </div>${nav("Revisar")}`;
}
function renderRev(){
  const acts = allActs(S); const tot = acts.reduce((s,a)=>s+actHours(a),0);
  const inc = acts.filter(a=>actMissing(a).length);
  const err = sendError ? `<div class="note err">${esc(sendError)}</div>` : "";
  return `<div class="stack"><span class="eyebrow">Revisão</span><h2>Confira antes de enviar</h2></div>
  <div class="card stack">
    <div class="summary"><div><span>Nome</span><b style="font-size:16px">${esc(S.nome)||"—"}</b></div><div><span>Cargo</span><b style="font-size:16px">${esc(roleOf(S)||"—")}</b></div><div><span>Atividades</span><b>${acts.length}</b></div><div><span>Tempo somado</span><b>${fmt(tot)} h/sem</b></div></div>
    ${inc.length?`<div class="note err">${inc.length} atividade(s) estão incompletas: ${inc.map(a=>esc(a.nome)).join("; ")}. Volte à etapa de atividades para completar, ou envie assim mesmo.</div>`:`<div class="note">Tudo preenchido. Obrigado pelo tempo!</div>`}
    ${err}
  </div>
  <div class="btns"><button type="button" class="btn" data-go="-1">Voltar</button><div class="row"><button type="button" class="btn" data-jump="3">Editar atividades</button><button type="button" class="btn accent" data-send ${!SHEET_URL?"disabled":""}>Enviar respostas</button></div></div>`;
}
function renderDone(){
  return `<div class="card done stack" style="align-items:center">
    <svg class="ring" width="64" height="64" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="14" r="8.5" fill="none" stroke="var(--brand)" stroke-width="3.2"/><path d="M6.2 9.2 A8.5 8.5 0 0 1 19.8 9.2" fill="none" stroke="var(--accent)" stroke-width="3.2" stroke-linecap="round"/></svg>
    <h2>Respostas enviadas</h2>
    <p class="lead" style="margin:0 auto">Obrigado, ${esc((S.nome||"").split(" ")[0])}! Se lembrar de algo depois, é só abrir este link de novo, ajustar e reenviar.</p>
    <button type="button" class="btn" data-jump="1">Revisar minhas respostas</button>
  </div>`;
}
let sendError = "", finished = false;
const RENDER = {intro:renderIntro,id:renderId,dia:renderDia,ativ:renderAtiv,extra:renderExtra,ferr:renderFerr,ctrl:renderCtrl,form:renderForm,perc:renderPerc,rev:renderRev};
function render(){
  setVertical(); progress();
  app.innerHTML = finished ? renderDone() : `<div class="stack">${RENDER[STEPS[step].k]()}</div>`;
}
function validateStep(){
  missing = new Set();
  const k = STEPS[step].k;
  if(k==="id"){ if(!S.nome.trim()) missing.add("nome"); if(!S.vertical) missing.add("vertical"); if(!S.cargo) missing.add("cargo"); if(S.cargo==="outro" && !S.cargoOutro.trim()) missing.add("cargoOutro"); return missing.size===0; }
  if(k==="ativ"){ Object.entries(S.atividades).forEach(([n,a])=>{ if(a.on && actMissing(a).length) missing.add(n); }); (S.extras||[]).forEach((a,i)=>{ if(a.nome && actMissing(a).length) missing.add("x"+i); }); return true; }
  return true;
}
async function go(d){
  if(d>0){ const ok = validateStep(); if(!ok){ render(); return; } if(STEPS[step].k==="ativ" && missing.size && !go.warned){ go.warned = true; render(); return; } }
  go.warned = false; missing = new Set();
  step = Math.max(0, Math.min(STEPS.length-1, step+d));
  render(); window.scrollTo({top:0});
  if(d>0 && step>1) persist().catch(()=>{});
}

/* atualização de campos sem re-render */
function getAct(el){ if(el.dataset.a!=null) return S.atividades[el.dataset.a] || (S.atividades[el.dataset.a]={on:true}); return S.extras[+el.dataset.x]; }
function refreshCalc(el){ const box = el.closest(".act"); if(!box) return; const a = getAct(el); const c = box.querySelector("[data-calc]"); const h = actHours(a); if(c) c.innerHTML = h?`≈ <b>${fmt(h)} h por semana</b>`:"Preencha quantidade, período e minutos para ver o tempo semanal."; const t = document.querySelector("[data-tot]"); if(t) t.textContent = fmt(allActs(S).reduce((s,x)=>s+actHours(x),0))+" h/sem"; }
app.addEventListener("input", e => {
  const el = e.target;
  if(el.dataset.in){ S[el.dataset.in] = el.value; localSave(); return; }
  if(el.dataset.ai){ const a = getAct(el); a[el.dataset.ai] = el.value;
    if(el.dataset.ai==="minutos"){ el.closest(".q").querySelectorAll('[data-af="minutos"]').forEach(b=>b.setAttribute("aria-pressed", b.dataset.v===el.value)); }
    refreshCalc(el); localSave(); }
});
app.addEventListener("click", async e => {
  if(e.target.matches("input,textarea")) return;
  const b = e.target.closest("button, tr.click"); if(!b) return;
  const keepY = window.scrollY;
  if(b.dataset.go){ go(+b.dataset.go); return; }
  if(b.dataset.jump){ finished = false; step = +b.dataset.jump; render(); window.scrollTo({top:0}); return; }
  if(b.dataset.vert){ if(S.vertical!==b.dataset.vert){ S.vertical = b.dataset.vert; S.cargo = ""; } }
  else if(b.dataset.f){ S[b.dataset.f] = (S[b.dataset.f]===b.dataset.v && b.dataset.f!=="cargo") ? "" : b.dataset.v; }
  else if(b.dataset.m){ const arr = S[b.dataset.m] = S[b.dataset.m]||[]; const i = arr.indexOf(b.dataset.v); i>=0?arr.splice(i,1):arr.push(b.dataset.v); }
  else if(b.dataset.toggle!=null){ const n = b.dataset.toggle; const a = S.atividades[n] || (S.atividades[n]={}); a.on = !a.on; missing.delete(n); }
  else if(b.dataset.af){ const a = getAct(b); a[b.dataset.af] = (a[b.dataset.af]===b.dataset.v) ? "" : b.dataset.v; }
  else if(b.dataset.am){ const a = getAct(b); const arr = a[b.dataset.am] = a[b.dataset.am]||[]; const i = arr.indexOf(b.dataset.v); i>=0?arr.splice(i,1):arr.push(b.dataset.v); }
  else if(b.hasAttribute("data-addx")){ S.extras = S.extras||[]; S.extras.push({nome:""}); render(); const inp = document.getElementById("xn-"+(S.extras.length-1)); inp && inp.focus(); localSave(); return; }
  else if(b.dataset.delx!=null){ S.extras.splice(+b.dataset.delx,1); missing = new Set(); }
  else if(b.hasAttribute("data-send")){ b.disabled = true; b.textContent = "Enviando…"; sendError = "";
    try{ await persist("enviado"); finished = true; render(); window.scrollTo({top:0}); }
    catch(err){ S.status = "rascunho"; localSave(); sendError = err && err.message==="sem-url" ? "O envio ainda não está configurado. Avise o Leonardo. Suas respostas continuam salvas neste navegador." : "Não foi possível enviar agora. Verifique a conexão e tente de novo. Suas respostas continuam salvas neste navegador."; render(); }
    return; }
  else return;
  localSave(); render(); window.scrollTo({top:keepY});
});

/* ---------- cálculos e linhas para a planilha (mesmas colunas da exportação CSV do painel) ---------- */
function calcPerson(r){
  const acts = allActs(r);
  const dem = acts.reduce((s,a)=>s+actHours(a),0);
  const byClass = {}; CLASSES.forEach(c=>byClass[c]=0); let semClasse = 0;
  acts.forEach(a=>{ const h = actHours(a); if(byClass[a.classe]!=null) byClass[a.classe]+=h; else semClasse+=h; });
  const reun = num(r.reunioesHoras), wpp = (WHATS[r.whatsapp]||0)*5, retr = num(r.retrabalhoVezes)*num(r.retrabalhoMin)/60;
  const jor = JORNADA_PADRAO;
  const disp = Math.max(jor - reun - wpp, 0.1);
  const auto = acts.filter(a=>a.auto==="Sim").reduce((s,a)=>s+actHours(a),0);
  return {acts, dem, byClass, semClasse, reun, wpp, retr, jor, disp, occ: dem/disp, auto};
}
const r2 = n => Math.round((n||0)*100)/100;
const PERIODO_LABEL = k => (PERIODS.find(p=>p[0]===k)||["",""])[1];
const PESSOAS_COLS = ["ID","Atualizado em","Nome","Vertical","Cargo","Status","Jornada","Horas atividades/sem","Reuniões h/sem","WhatsApp+e-mail h/sem","Ocupação %","Essencial h","Apoio h","Refazer h","Retrabalho declarado h/sem","Automatizável h","Carga 1-5","Hora extra","Dia típico","Picos","Horário início","Horário fim","Reuniões por semana","Interrupções por dia","WhatsApp e e-mail por dia","Tempo no cargo","Origem informação incompleta","Sistemas","Duplicidade","Ferramenta que atrapalha","Deixa de fazer","Mais tempo menos valor","Automatizaria","Comentário","Outras funções","Clientes atendidos","Etapas da jornada","Canais","Quem envia","Origem incompleta (opções)","Ferramenta pessoal","Histórico fica em","Prazo combinado","Descobre atraso","Alguém continuaria","O que faltaria","Como aprendeu","Faltou saber","Sabe como é avaliado","Oportunidades de venda","Cargo (outro)","Outra função (qual)","Outro canal (qual)","Outra origem de demanda (qual)","Outra origem incompleta (qual)","Outro lugar do histórico (qual)","Outro aprendizado (qual)"];
const ATIV_COLS = ["ID","Atualizado em","Nome","Vertical","Cargo","Atividade","Sugerida","Quantidade","Período","Minutos","Horas/semana","Classificação","Automática","Ferramentas","Depende","De quem","Quem confere","Quem confere (outra pessoa)","Outra ferramenta (qual)"];
function pessoaRow(r){
  const c = calcPerson(r);
  return [r._id,r.atualizadoEm,r.nome,VLABEL[r.vertical]||"",roleOf(r),r.status,c.jor,r2(c.dem),r2(c.reun),r2(c.wpp),Math.round(c.occ*100),r2(c.byClass[CLASSES[0]]),r2(c.byClass[CLASSES[1]]),r2(c.byClass[CLASSES[2]]),r2(c.retr),r2(c.auto),r.carga,r.horaExtra,r.dia,r.picos,r.horaInicio,r.horaFim,r.reunioesQtd,r.interrupcoes,r.whatsapp,r.tempoCargo,r.origemIncompleto,(r.sistemas||[]).join(", ")+(r.sistemasOutros?" · "+r.sistemasOutros:""),r.duplicidade,r.ferramentaAtrapalha,r.deixaDeFazer,r.menorValor,r.automatizar,r.comentario,(r.outrasFuncoes||[]).join(", "),r.carteiraQtd,(r.etapas||[]).join(", "),(r.canais||[]).join(", "),(r.origens||[]).join(", "),(r.origemOpts||[]).join(", "),r.contaPessoal,(r.historico||[]).join(", "),r.prazo,r.atraso,r.ausencia,r.ausenciaFalta,(r.aprendeu||[]).join(", "),r.faltouSaber,r.avaliado,r.oportunidades,r.cargoOutro,r.outrasFuncoesOutra,r.canaisOutro,r.origensOutra,r.origemOutra,r.historicoOutro,r.aprendeuOutro].map(v=>v==null?"":v);
}
function atividadeRows(r){
  return allActs(r).map(a=>[r._id,r.atualizadoEm,r.nome,VLABEL[r.vertical]||"",roleOf(r),a.nome,a.sugerida?"Sim":"Não",num(a.qtd)||"",PERIODO_LABEL(a.periodo),num(a.minutos)||"",r2(actHours(a)),a.classe,a.auto,(a.ferramentas||[]).join(", "),a.depende,a.dependeDe,a.confere,a.confereQuem,a.ferramentasOutra].map(v=>v==null?"":v));
}
function buildPayload(r){
  return {versao:1, id:r._id, atualizadoEm:r.atualizadoEm, nome:r.nome,
    pessoas:{cabecalho:PESSOAS_COLS, linha:pessoaRow(r)},
    atividades:{cabecalho:ATIV_COLS, linhas:atividadeRows(r)},
    json:JSON.stringify(r)};
}

/* ---------- início ---------- */
const local = localLoad(); if(local && local.S){ S = {...blank(), ...local.S}; if(S.status==="enviado") finished = true; }
myId = getId();
render();
})();
</script>
